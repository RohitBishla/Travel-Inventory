services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./db/create-user.sql:/docker-entrypoint-initdb.d/create-user.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      SHARD_0_URL: jdbc:mariadb://mariadb:3306/travel_shard_0?createDatabaseIfNotExist=true
      SHARD_1_URL: jdbc:mariadb://mariadb:3306/travel_shard_1?createDatabaseIfNotExist=true
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mariadb-data:
