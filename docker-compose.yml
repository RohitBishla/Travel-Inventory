services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: travel_invoice
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: travel
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel_invoice"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DATABASE_URL: jdbc:postgresql://postgres:5432/travel_invoice
      DATABASE_USERNAME: travel
      DATABASE_PASSWORD: travel
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
