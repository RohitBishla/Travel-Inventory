spring:
  application:
    name: travel-invoice
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    deserialization:
      use-big-decimal-for-floats: true
      fail-on-unknown-properties: false
    datatype:
      enum:
        fail-on-numbers-for-enums: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
  paths-to-match: /transactions/**, /invoices/**

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, shards

travel:
  sharding:
    username: ${DATABASE_USERNAME:travel}
    password: ${DATABASE_PASSWORD:travel}
    pool-size-per-shard: 10
    lock-wait-timeout-seconds: 3
    fresh-schema: false
    shards:
      - id: 0
        url: ${SHARD_0_URL:jdbc:mariadb://localhost:3306/travel_shard_0?createDatabaseIfNotExist=true}
      - id: 1
        url: ${SHARD_1_URL:jdbc:mariadb://localhost:3306/travel_shard_1?createDatabaseIfNotExist=true}
    previous-ring: []
