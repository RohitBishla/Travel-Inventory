spring:
  application:
    name: travel-invoice
  datasource:
    url: jdbc:h2:file:./data/travel-invoice;LOCK_TIMEOUT=3000
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 20
      connection-timeout: 3000
  jdbc:
    template:
      query-timeout: 10s
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    deserialization:
      use-big-decimal-for-floats: true
      fail-on-unknown-properties: false
    datatype:
      enum:
        fail-on-numbers-for-enums: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
  paths-to-match: /transactions/**, /invoices/**

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db
